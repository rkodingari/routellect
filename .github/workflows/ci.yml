name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest --cov=routellect --cov-report=term-missing --cov-fail-under=80
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm typecheck
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend

  container-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: podman build --target python-builder -t routellect-builder:test .
      - run: podman inspect routellect-builder:test >/dev/null
